plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+' // pin this version for reproducible production builds
}
version = mod_version
group = 'dev.rimucinematic'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}
neoForge {
    version = neo_version
    mods { "${mod_id}" { sourceSet sourceSets.main } }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}
dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    compileOnly files('libs/rimulib-1.3.0-neoforge.jar')
    // The Shooting Star is a *runtime* dependency, and is not redistributed here.
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
